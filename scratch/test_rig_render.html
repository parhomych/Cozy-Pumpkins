<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Witch Rig Test</title>
  <script src="/vendor/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #1a162b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: sans-serif;
      color: #fff;
    }
    .viewport {
      position: relative;
      width: 960px;
      height: 540px;
      background: #25203d;
      border: 2px solid #554477;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <h1>Witch Rig Test</h1>
  <div id="container" class="viewport"></div>
  <script type="module">
    import { WitchAssistant } from '/js/shared/witch-assistant.js?t=' + Date.now();
    const container = document.getElementById('container');
    const witch = new WitchAssistant(container, { scale: 0.22 });
    window.witch = witch;
    witch.show();
    witch.setPosition(480, 480);
    witch.setFacing(1);
    witch._setPose('idle');
  </script>
</body>
</html>
